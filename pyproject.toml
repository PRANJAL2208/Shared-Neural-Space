[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shared-neural-space"
version = "0.1.0"
description = "Shared latent EEG representational geometry across human brains"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "mne>=1.7.0",
    "mne-bids>=0.14.0",
    "eegdash>=0.1.0",
    "braindecode>=0.8.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "zarr>=2.18.0",
    "numcodecs>=0.12.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
late = [
    "umap-learn>=0.5.6",
    "transformers>=4.40.0",
    "open_clip_torch>=2.24.0",
    "lightning>=2.3.0",
    "wandb>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
